<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Legal News - NyaySetu</title><link rel="stylesheet" href="css/style.css"></head>
<body><header><nav class="nav" data-nav><a class="brand" href="index.html">NyaySetu</a></nav></header>
<main class="container"><h1>Legal News and Judiciary Updates</h1><div id="news-list" class="grid"></div></main>
<script src="js/app.js"></script><script>
document.addEventListener('DOMContentLoaded',async()=>{try{const news=await api('/news');const el=document.querySelector('#news-list');el.innerHTML=news.length?news.map(n=>`<article class="card"><h2>${n.title}</h2><p>${n.summary}</p><small>${n.source||'NyaySetu'} - ${n.published_at}</small></article>`).join(''):'<p>No news available.</p>'}catch(e){document.querySelector('#news-list').innerHTML=`<p class="error">${e.message}</p>`}});
</script></body></html>
