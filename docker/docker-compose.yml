services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: nyaya
      POSTGRES_USER: nyaya
      POSTGRES_PASSWORD: nyaya
    ports: ["5432:5432"]
    volumes: ["../scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro"]
  ai-service:
    build: { context: .., dockerfile: docker/Dockerfile.ai-service }
    ports: ["8000:8000"]
    depends_on: [postgres]
  chat-service:
    image: node:22-alpine
    working_dir: /app
    command: ["node", "server.js"]
    volumes: ["../backend/chat-service:/app:ro"]
    ports: ["3001:3001"]

