services:
  postgres:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_DB: nyaya
      POSTGRES_USER: nyaya
      POSTGRES_PASSWORD: nyaya
    ports: ["5432:5432"]
    volumes:
      - "../scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nyaya -d nyaya && psql -U nyaya -d nyaya -tAc 'SELECT PostGIS_Version()' | grep -q ."]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
  ai-service:
    build: { context: .., dockerfile: docker/Dockerfile.ai-service }
    ports: ["8000:8000"]
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - "../backend/ai-rag-service:/app"
    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      target: development
    ports: ["3000:3000"]
    command: ["npm", "run", "dev"]
    volumes:
      - "../frontend:/app"
      - frontend_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  frontend_node_modules:
