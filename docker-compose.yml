services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nyaysetu
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - nyaysetu-data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: 5000
      DATABASE_URL: postgres://postgres:postgres@db:5432/nyaysetu
      JWT_SECRET: change_for_deployment
      JWT_EXPIRES_IN: 1d
    ports:
      - "5000:5000"
    depends_on:
      - db

  frontend:
    image: nginx:alpine
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    ports:
      - "8080:80"

volumes:
  nyaysetu-data:
