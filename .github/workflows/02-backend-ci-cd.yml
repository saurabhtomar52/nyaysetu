name: Backend CI/CD
on:
  pull_request:
    paths: ["backend/**", "docker/**"]
  push:
    branches: [main]
    paths: ["backend/**", "docker/**"]
jobs:
  python:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend/ai-rag-service } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python -m compileall .
  node:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend/chat-service } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm test
  images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [python, node]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Configure ECR login, Docker Buildx, and ECS deployment with GitHub OIDC"

