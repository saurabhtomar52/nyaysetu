name: Backend CI/CD

on:
  pull_request:
    paths:
      - "backend/**"
      - "docker/**"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docker/**"

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'nyayaconnect/ai-service' }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER || 'nyayaconnect' }}
  ECS_SERVICE: ${{ vars.ECS_SERVICE || 'nyayaconnect' }}
  ECS_TASK_DEFINITION: ${{ vars.ECS_TASK_DEFINITION || 'nyayaconnect' }}

jobs:
  python-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/ai-rag-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/ai-rag-service/requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: pytest -q

  node-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/chat-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/chat-service/package.json
      - run: npm install
      - run: npm test

  build-scan-push-deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [python-tests, node-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build \
            --file docker/Dockerfile.ai-service \
            --tag "nyayaconnect-ai:${GITHUB_SHA}" \
            .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: nyayaconnect-ai:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-actions-backend-${{ github.run_id }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push immutable image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker tag "nyayaconnect-ai:${GITHUB_SHA}" "$ECR_REGISTRY/${ECR_REPOSITORY}:${GITHUB_SHA}"
          docker push "$ECR_REGISTRY/${ECR_REPOSITORY}:${GITHUB_SHA}"

      - name: Fetch current ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_DEFINITION" \
            --query taskDefinition \
            --output json > task-definition.json
          jq 'del(
            .taskDefinitionArn,
            .revision,
            .status,
            .requiresAttributes,
            .compatibilities,
            .registeredAt,
            .registeredBy
          )' task-definition.json > task-definition.cleaned.json
          mv task-definition.cleaned.json task-definition.json

      - name: Render ECS task definition
        id: task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ai-service
          image: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Deploy ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-definition.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
