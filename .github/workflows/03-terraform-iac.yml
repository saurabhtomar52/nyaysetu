name: Terraform IaC

on:
  pull_request:
    paths:
      - "terraform/**"
  push:
    branches: [main]
    paths:
      - "terraform/**"

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: true
  TF_INPUT: false
  TF_VAR_aws_region: ${{ vars.AWS_REGION || 'ap-south-1' }}
  TF_VAR_project_name: ${{ vars.TF_PROJECT_NAME || 'nyayaconnect' }}
  TF_VAR_vpc_cidr: ${{ vars.TF_VPC_CIDR || '10.40.0.0/16' }}
  TF_VAR_web_bucket_name: ${{ vars.TF_WEB_BUCKET_NAME }}
  TF_VAR_ai_service_image: ${{ vars.TF_AI_SERVICE_IMAGE }}
  TF_VAR_database_url_secret_arn: ${{ vars.TF_DATABASE_URL_SECRET_ARN || '' }}
  TF_VAR_db_password: ${{ secrets.TF_DB_PASSWORD }}

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.TF_VAR_aws_region }}
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          role-session-name: github-actions-terraform-plan-${{ github.run_id }}

      - name: Initialize Terraform
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=nyayaconnect/terraform.tfstate" \
            -backend-config="region=${{ env.TF_VAR_aws_region }}" \
            -backend-config="encrypt=true"

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Validate configuration
        run: terraform validate

      - name: Generate plan
        run: |
          set -o pipefail
          terraform plan -input=false -no-color 2>&1 | tee plan.txt
          {
            echo "## Terraform plan"
            echo
            echo '```terraform'
            head -c 60000 plan.txt
            echo
            echo '```'
          } > plan.md

      - name: Comment plan on pull request
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: terraform-plan
          path: terraform/plan.md

  apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.TF_VAR_aws_region }}
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          role-session-name: github-actions-terraform-apply-${{ github.run_id }}

      - name: Initialize Terraform
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=nyayaconnect/terraform.tfstate" \
            -backend-config="region=${{ env.TF_VAR_aws_region }}" \
            -backend-config="encrypt=true"

      - name: Apply Terraform
        run: terraform apply -auto-approve -input=false
